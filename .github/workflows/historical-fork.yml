name: Historical fork reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-fork:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: historical
      MAINNET_RPC_URL: ${{ secrets.MAINNET_ARCHIVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Check archive RPC configuration
        run: test -n "$MAINNET_RPC_URL"
      - name: Reproduce Parity library freeze at the pinned block
        run: forge test --match-test testExploit_ReproduceParityLibraryFreezeOnHistoricalFork -vvvv
